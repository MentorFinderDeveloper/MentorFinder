sonar.source=MFBackend,account,utils,dataset,search
sonar.inclusions=MFBackend/**/*.py,utils/**/*.py,account/**/*.py,dataset/**/*.py,search/**/*.py
sonar.exclusions=**/__pycache__/**,account/migrations/*.py

sonar.python.coverage.reportPaths=coverage-reports/coverage.xml
sonar.python.xunit.reportPath=xunit-reports/xunit-result.xml

sonar.coverage.exclusions=**/*migrations/*,**/manage.py,**/wsgi.py,**/asgi.py,**/settings.py,**/urls.py,**/apps.py,**/admin.py,**/tests.py,**/test_*.py,**/*_tests.py,**/MFBackend/**