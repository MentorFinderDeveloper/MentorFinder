image: registry.spring26a.secoder.net/tool/deployer

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - export BUILD_IMAGE_NAME=$CI_REGISTRY_IMAGE
    - export BUILD_IMAGE_TAG=$CI_COMMIT_REF_SLUG
    - export BUILD_IMAGE_USERNAME=$CI_REGISTRY_USER
    - export BUILD_IMAGE_PASSWORD=$CI_REGISTRY_PASSWORD
    - deployer build

unit-test:
  image: python:3.11
  stage: test
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py makemigrations account
    - python manage.py makemigrations dataset
    - python manage.py migrate
    - python3 manage.py createsuperuser --noinput || true
    - bash test.sh
  after_script:
    - SUFFIX=$RANDOM
    - curl "http://api.spring26a.secoder.net/static/sonar-scanner.tar.gz" -s -o "/tmp/sonar-$SUFFIX.tar.gz"
    - tar -xf "/tmp/sonar-$SUFFIX.tar.gz"  -C /opt
    - sed -i 's/sonarqube.secoder.net/sonarqube.spring26a.secoder.net/g' /opt/sonar-scanner/conf/sonar-scanner.properties
    - sed -i 's/api.secoder.net/api.spring26a.secoder.net/g' /opt/sonar-scanner/bin/sonar-scanner
    - /opt/sonar-scanner/bin/sonar-scanner

deploy:
  stage: deploy
  script:
    - export API_SERVER=https://deployer.spring26a.secoder.net/api
    - deployer dyno replace "$CI_PROJECT_NAME" "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "$REGISTRY_USER" "$REGISTRY_PWD"
