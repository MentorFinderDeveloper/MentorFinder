worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_forwarded_proto $external_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 10m;

        location = /health {
            access_log off;
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }

        # Browser requests use /api; Django routes are rooted at /.
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        }

        location ^~ /media/ {
            proxy_pass http://127.0.0.1:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
        }

        location ^~ /static/ {
            alias /app/static/;
            access_log off;
            expires 7d;
        }

        location = /admin {
            proxy_pass http://127.0.0.1:8000/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        }

        location ^~ /admin/ {
            proxy_pass http://127.0.0.1:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        }

        # The outer gateway strips PUBLIC_SITE_PATH. Next.js is built with that
        # basePath, so add it back only on the internal frontend hop.
        location / {
            rewrite ^/$ /se-projects/mentorfinder break;
            rewrite ^(.*)$ /se-projects/mentorfinder$1 break;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        }
    }
}
